<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hamster-Lab">
  <!-- Essential mark: ears + head + aviators + teal/orange scarf -->
  <rect width="32" height="32" rx="8" fill="#141414"/>
  <!-- ears -->
  <circle cx="9.5" cy="9" r="5.2" fill="#e08a2e"/>
  <circle cx="22.5" cy="9" r="5.2" fill="#e08a2e"/>
  <circle cx="9.5" cy="9.2" r="2.4" fill="#f0b59a"/>
  <circle cx="22.5" cy="9.2" r="2.4" fill="#f0b59a"/>
  <!-- head -->
  <circle cx="16" cy="16.5" r="10.2" fill="#e8993a"/>
  <ellipse cx="16" cy="19.2" rx="8.2" ry="6.4" fill="#f3e6d2"/>
  <!-- sunglasses -->
  <rect x="6.2" y="12.2" width="19.6" height="7.2" rx="3.4" fill="#0a0a0a"/>
  <rect x="7.2" y="13.1" width="7.6" height="5.4" rx="2.6" fill="#1c1c1c"/>
  <rect x="17.2" y="13.1" width="7.6" height="5.4" rx="2.6" fill="#1c1c1c"/>
  <path d="M14.8 15.2h2.4" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M8.2 14.2h2.4" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <path d="M18.2 14.2h2.4" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
  <!-- nose + smile -->
  <ellipse cx="16" cy="21.2" rx="1.1" ry="0.85" fill="#e2899a"/>
  <path d="M14.2 22.6c1.1 1.1 2.5 1.1 3.6 0" fill="none" stroke="#2a1f18" stroke-width="0.9" stroke-linecap="round"/>
  <!-- scarf: teal + orange -->
  <rect x="8.5" y="25.2" width="15" height="2.4" rx="1.2" fill="#14c8c4"/>
  <rect x="8.5" y="27.4" width="15" height="2.4" rx="1.2" fill="#ff7a18"/>
</svg>
